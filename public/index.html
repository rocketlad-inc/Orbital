    <!--
      WIDGET PAIRING, ON THE WAY IN.

      The Android app puts a waiting widget's pairing code in the launch
      URL as ?w=, and this binds it to the signed-in player while the
      game is still loading. It happens HERE, in the shell, rather than
      on a page of its own: the connect page it replaces meant a whole
      extra document load, fetch and redirect before the game even
      started, which on a phone was several seconds of grey.

      It must be the page's own fetch. The session cookie is
      SameSite=Strict, and a navigation the app launches is cross-site
      to Chrome, so a server-rendered page reached that way arrives
      signed out; a same-site fetch from the loaded page carries it.

      Fire and forget. If it fails because the player is not signed in
      yet, the app sends the code again on the next launch.
    -->
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var code = u.searchParams.get('w');
          if (!code || !/^[A-Za-z0-9_-]{16,64}$/.test(code)) return;
          // ?ws= is what the device is asking to be able to do. The Wear
          // OS companion asks for 'wear', which is the card's capability
          // plus a senate vote (migration 0136); the home-screen widget
          // sends nothing and gets 'card', which is what every build
          // already installed does. Anything else is dropped here rather
          // than forwarded, so an odd URL pairs a normal widget instead
          // of failing the pairing outright.
          var scope = u.searchParams.get('ws');
          if (scope !== 'wear' && scope !== 'wear_orders') scope = 'card';
          // A WATCH IS ASKED ABOUT ONCE, HERE, AND NEVER AGAIN.
          //
          // This is the only moment that needs a person. A pairing code
          // arrives in a URL, and a URL is something a stranger can get
          // your phone to open while you are signed in -- so the question
          // guards the PAIRING, which is where the trust actually starts.
          // It used to guard the 'wear_orders' scope instead, which stopped
          // meaning anything the moment a paired watch could upgrade
          // itself: pair quietly as 'wear', then ask the server. One door,
          // one lock.
          //
          // Say yes and the watch simply works. Say no and nothing pairs.
          if ((scope === 'wear' || scope === 'wear_orders') && !window.confirm(
            // "\n" ESCAPES, NEVER LITERAL LINE BREAKS: a quoted string
            // cannot span lines, and one did — the whole pairing script
            // failed to parse, so no widget or watch could pair.
            // src/__tests__/indexHtmlScripts.test.ts now parses this block.
            'Pair this watch with Orbital?\n\n' +
            'It will show your empire and let you retreat, detonate and move your ' +
            'ships, set their stances and targets, answer trade and peace offers, ' +
            'reply to messages, vote in the senate and order ships at your ' +
            'shipyards.\n\n' +
            'You can revoke it at any time in your account settings.')) {
            return;
          }
          // One grant, and it is the useful one: a watch that pairs can act.
          if (scope === 'wear') scope = 'wear_orders';
          // Out of the URL before the app boots, so a reload cannot
          // replay it and nothing downstream has to know about it.
          u.searchParams.delete('w');
          u.searchParams.delete('ws');
          window.history.replaceState(null, '', u.pathname + u.search + u.hash);
          // A FAILED BIND USED TO BE SILENT, and that is how a watch
          // handing over a code it had already used looked like nothing
          // happening at all. The watch files its own request now
          // (worker/wearRequests.js), so this path is the first pairing
          // only -- but it still says so when it fails.
          window.fetch('/api/me/widget-tokens/pair', {
            method: 'POST',
            credentials: 'include',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: code, scope: scope }),
          }).then(function (r) {
            if (!r.ok) window.alert('That device could not be paired. Ask it to connect again.');
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Is Orbital free?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Orbital is free to play with no ads, and nothing that affects the game is for sale. An optional one-time Commander’s Commission ($10) unlocks ship designs, megastructure looks, premium emblems, and your games posted to your own Discord server."}}, {"@type": "Question", "name": "Do I need to download anything?", "acceptedAnswer": {"@type": "Answer", "text": "No. Orbital runs in any modern browser on desktop, tablet or phone. Sign in with Google or an email address and join a game straight away."}}, {"@type": "Question", "name": "How long does a game last?", "acceptedAnswer": {"@type": "Answer", "text": "There is no turn limit: a game runs until someone wins. The default is one turn an hour, which suits checking in a few times a day. Hosts can choose anything from a turn a minute to a turn a day."}}, {"@type": "Question", "name": "What happens while I’m offline?", "acceptedAnswer": {"@type": "Answer", "text": "Your empire keeps going. Turns resolve on schedule, freighters keep running their routes and armed stations defend themselves. Nobody plays your empire for you, so set your orders before you log off."}}, {"@type": "Question", "name": "How many players are in a game?", "acceptedAnswer": {"@type": "Answer", "text": "Two to eight. Quick Join drops you into the fullest open game, or you can browse the lobby or invite friends to a private game. You can even join a game that has already started, as long as a home world is still free."}}, {"@type": "Question", "name": "Is Orbital like Neptune’s Pride?", "acceptedAnswer": {"@type": "Answer", "text": "If you have played Neptune’s Pride, the rhythm will feel familiar: a shared map, turns that run on a real clock, and alliances that matter. Orbital sets it in the real solar system and adds orbital flight, ship desig
