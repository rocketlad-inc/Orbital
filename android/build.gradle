// AGP 8.5 cannot compile against API 36 — Android 16 support arrived in
// 8.9. Play has required target API 36 for new apps and updates since
// 31 August 2026, so the toolchain floor is set by the store, not by us.
// 8.11 needs Gradle 8.13; the workflow generates that wrapper.
// Kotlin is here for :wear only. The phone app is Java and stays Java:
// a TWA is one activity and a couple of receivers, and nothing about it
// is improved by a second language in the build.
plugins {
  id 'com.android.application' version '8.11.1' apply false
  //
  // 2.2.21 AND NOT THE NEWEST. Since Kotlin 2.0 the Compose compiler
  // ships WITH Kotlin, so this version also chooses the compiler that
  // generates against the Compose runtime :wear depends on -- and that
  // runtime is pinned back to 1.9.5 by the AGP ceiling (see
  // wear/build.gradle). A compiler from the 2.3 line generates calls
  // for a runtime a year newer than the one that will be on the
  // classpath. 2.2.x is the line Compose 1.9 shipped alongside.
  //
  // These two must match each other exactly.
  id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
  id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
}
