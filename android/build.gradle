// AGP 8.5 cannot compile against API 36 — Android 16 support arrived in
// 8.9. Play has required target API 36 for new apps and updates since
// 31 August 2026, so the toolchain floor is set by the store, not by us.
// 8.11 needs Gradle 8.13; the workflow generates that wrapper.
// Kotlin is here for :wear only. The phone app is Java and stays Java:
// a TWA is one activity and a couple of receivers, and nothing about it
// is improved by a second language in the build.
plugins {
  id 'com.android.application' version '8.11.1' apply false
  id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
  // Since Kotlin 2.0 the Compose compiler ships WITH Kotlin and is
  // applied as a plugin at the Kotlin version, rather than being pinned
  // separately against a compatibility table. These two must match.
  id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21' apply false
}
