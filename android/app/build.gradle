// ============================================================
// Orbital for Android — a Trusted Web Activity.
//
// WHAT THIS APP CONTAINS: no game code at all. A TWA is a full-screen
// Chrome tab with the browser UI removed, pointed at orbital-empire.com
// and verified as belonging to us (see .well-known/assetlinks.json).
// The renderer, the fleet orders, the trade panel — all of it is the
// same web client that already runs at 62 fps on Android Chrome. That is
// the point: one codebase, and a deploy updates the app instantly with
// no store review.
//
// SIGNING. The upload key lives in GitHub Actions secrets and never in
// this repository. The build is unsigned unless those secrets are
// present, so a fork or a local build cannot produce something that
// passes as ours.
// ============================================================

plugins { id 'com.android.application' }

android {
  namespace 'com.orbitalempire.game'
  compileSdk 36

  defaultConfig {
    applicationId 'com.orbitalempire.game'
    // NOT a free choice either: Play's automatic protection (the pairip
    // integrity wrapper this app ships under) refuses a bundle below 24
    // at upload -- "requires a minimum SDK version of 24 or higher" --
    // which first bit the 2.8.0 publish on 2026-10-01. It was 21, the
    // floor androidbrowserhelper supports. Android 5-6 phones keep the
    // last build they installed; they just stop receiving updates.
    minSdk 24
    // NOT a free choice: Play rejects a bundle below this at commit time
    // with "Target SDK of artifact is too low" (its message quotes a
    // nonsense number, so trust the policy, not the error). API 36 has
    // been the floor for new apps and updates since 31 August 2026.
    targetSdk 36
    // parseInt, not a cast: `versionCode (expr) as Integer` reads to
    // Groovy as a call to the void setter followed by a cast of its null
    // result, which fails with a bare "Value is null".
    versionCode Integer.parseInt(project.findProperty('orbitalVersionCode') ?: '1')
    versionName project.findProperty('orbitalVersionName') ?: '1.0.0'
    // Only the emulator smoke test uses this; it binds a real widget and
    // lets the system drive the receiver inside this process.
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  signingConfigs {
    release {
      // Populated from the environment in CI. Left null locally, which
      // makes a local build produce an unsigned APK rather than failing.
      def store = System.getenv('ANDROID_KEYSTORE_PATH')
      if (store) {
        storeFile file(store)
        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        // A PKCS#12 keystore holds one password for both the store and
        // the key, which is why these are the same value.
        keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        storeType 'PKCS12'
      }
    }
  }

  buildTypes {
    release {
      // Nothing to shrink: the app is a manifest and one activity.
      minifyEnabled false
      signingConfig System.getenv('ANDROID_KEYSTORE_PATH') ? signingConfigs.release : null
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Google's own TWA support library: it launches the Custom Tab in
  // trusted mode, handles the splash screen, and falls back gracefully
  // on a device whose browser cannot do TWAs.
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

  // THE WATCH RELAY (OrbitalNotificationRelay): Orbital's phone alerts,
  // handed to the watch app over the Wear Data Layer. 19.0.0 because this
  // app once installed on Android 5 (minSdk 21) and 20.x needs 23; its AAR
  // and those it pulls in (base 18.5.0, basement 18.4.0, tasks 18.2.0)
  // carry no AGP or compileSdk floor.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'

  // Plain JVM unit tests (src/test), run by CI as :app:testReleaseUnitTest.
  // Pure arithmetic only, e.g. WidgetSizeTest. Ships in nothing.
  testImplementation 'junit:junit:4.13.2'

  // Instrumentation only. Nothing here ships in the release APK.
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
