name: Wear review

# Every watch screen drawn from a real player's documents, at the player's
# watch size and the small emulator face (see .github/scripts/wear-review.sh).
# Dispatch only: the fixture is a player's empire and arrives as an input,
# never as a file in the repository.
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'base64 .tar.gz of the watch documents + shots.txt'
        required: true
  # Only so GitHub registers the workflow (the default branch carries no
  # workflows, and a dispatch-only file on a branch is never listed). The
  # job below skips itself without a fixture, so a push runs nothing.
  push:
    paths:
      - '.github/workflows/wear-review.yml'

permissions:
  contents: read

jobs:
  review:
    if: ${{ inputs.fixture != '' && inputs.fixture != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the watch APK
        working-directory: android
        run: gradle --no-daemon :wear:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Draw every screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FIXTURE_B64: ${{ inputs.fixture }}
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wear_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/wear-review.sh android/wear/build/outputs/apk/debug/wear-debug.apk wear-review
      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-review
          path: wear-review/
          retention-days: 3
          if-no-files-found: warn
