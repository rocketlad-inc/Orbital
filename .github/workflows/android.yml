# ============================================================
# Build the Orbital Android app.
#
# WHY CI AND NOT A LOCAL BUILD. The Android toolchain is a JDK plus
# several gigabytes of SDK, and the machine this was written on is
# Windows on ARM, where that stack is a fight. A GitHub runner has it
# already, the build is reproducible, and the signing key lives in
# repository secrets rather than on anyone's laptop.
#
# WHAT IT PRODUCES
#   orbital-apk  — a signed APK. Install it directly on a phone; this is
#                  the artifact for testing and for sideloading.
#   orbital-aab  — a signed Android App Bundle, the format Google Play
#                  requires for a store listing.
#   orbital-wear-apk / orbital-wear-aab — the same pair for the Wear OS
#                  companion. SAME package name and SAME signing key as
#                  the phone app, because Play treats them as one app;
#                  a DIFFERENT version code, because a watch artifact's
#                  code must be unique across form factors.
#
# The app is a thin wrapper around orbital-empire.com, so this only needs
# re-running when the wrapper itself changes (icons, name, target URL) or
# when a new version goes to Play — NOT on every game deploy. Web changes
# reach the app the moment the Worker deploys.
#
# Signed only when the secrets exist, so a fork builds an unsigned APK
# rather than failing, and cannot produce something that passes as ours.
# ============================================================

name: Android app

on:
  # Deliberately manual. The wrapper changes rarely, and a build on every
  # push to a busy game repo would be noise.
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown to players (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      versionCode:
        description: 'Play version code — must increase with every store upload'
        required: false
        default: '1'
      publish:
        description: 'Upload to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        required: false
        default: false
      track:
        description: 'Play track to publish the PHONE bundle to'
        type: choice
        required: false
        default: internal
        options: [internal, alpha, beta, production]
      publishWear:
        description: 'Also upload the Wear OS bundle (needs the Wear OS form factor added in Play Console)'
        type: boolean
        required: false
        default: false
      wearTrack:
        description: 'Play track for the WATCH bundle (Wear OS has its own, separate from the phone tracks)'
        type: choice
        required: false
        default: 'wear:internal'
        options: ['wear:internal', 'wear:beta', 'wear:production', 'wear:The Beginning']
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` is not yet set when
    # its `if:` is evaluated, so the publish gate below would always see
    # an empty string and never run.
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Name the packages explicitly. The action's default list still
          # asks for the long-obsolete 'tools' package, which no longer
          # exists in the repository and fails the whole step.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing key configured — building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbital-upload.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Pin Gradle rather than generating a wrapper with whatever the
      # runner ships. `gradle wrapper` has to configure the project to
      # find the task, so it runs AGP under the PREINSTALLED Gradle —
      # currently 9.7.1, which deleted an internal API that AGP 8.x still
      # calls. The wrapper never got written; the build died generating
      # it. Installing the version we want sidesteps the whole dance.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/orbital-upload.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle --no-daemon \
            -PorbitalVersionName="${{ inputs.versionName || '1.0.0' }}" \
            -PorbitalVersionCode="${{ inputs.versionCode || '1' }}" \
            assembleRelease bundleRelease

      - name: Report what was built
        working-directory: android
        run: |
          echo "### Orbital Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed: ${{ steps.signing.outputs.signed }}" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
            echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done
          # The fingerprint the site's assetlinks.json must carry, printed
          # so a key change cannot silently break domain verification (the
          # symptom is an address bar appearing across the top of the game).
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK=$(find app/build/outputs -name '*.apk' | head -1)
            "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK" \
              | grep -i 'SHA-256' >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbital-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-wear-apk
          path: android/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbital-wear-aab
          path: android/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ---- Google Play -------------------------------------------------
      #
      # DORMANT UNTIL THE SECRET EXISTS. Without PLAY_SERVICE_ACCOUNT_JSON
      # this step is skipped and the build still hands you artifacts, so
      # nothing here can break a plain APK build.
      #
      # THE FIRST BUNDLE CAN COME THROUGH HERE — tested, against the real
      # app: edits.insert, bundle upload and track assignment all
      # succeeded via the API with no prior console upload. What the API
      # cannot do is the paperwork (store listing, content rating, data
      # safety); those gate *publishing to users*, not uploading.
      #
      # The service account is invited under Play Console →
      # Users and permissions, NOT the old "API access" page, which
      # Google removed.
      #
      # 'internal' publishes in minutes with no review wait, which is the
      # track for putting a build on your own phone and a playtester's.
      # Promoting to production is where review time appears.
      - name: Publish to Google Play
        id: play
        continue-on-error: true
        if: ${{ inputs.publish && env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orbitalempire.game
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      # "This edit has expired, please create a new Edit."
      #
      # A Play edit is invalidated by any OTHER edit opened against the
      # same app while it is open, and this repo opens one on every smoke
      # run (play-apks.mjs resolving 'latest'). Smoke triggers on pushes
      # to android/**, so a publish dispatched from that same change
      # races it by construction. Nothing was uploaded when an edit dies
      # -- the versionCode is still free -- so the retry is safe, and it
      # is the only thing that makes the race a non-event rather than a
      # build somebody has to notice and rerun by hand.
      - name: Publish to Google Play (retry)
        if: ${{ inputs.publish && env.PLAY_JSON != '' && steps.play.outcome == 'failure' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orbitalempire.game
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      # ---- Google Play, the watch ---------------------------------------
      #
      # A SEPARATE UPLOAD TO A SEPARATE TRACK, and not another file on the
      # phone release. Since March 2023 Wear OS artifacts belong on
      # dedicated form-factor tracks, and since September 2023 a Wear
      # release left on a mobile track can still serve the users who have
      # it but can no longer be updated.
      #
      # THE TRACK NAMES ARE THE ACCOUNT'S, NOT THE DOCUMENTATION'S. The
      # published guidance names wear:qa; this app does not have one. Ask
      # the API instead of a doc -- a wrong track is refused during
      # validation, BEFORE anything uploads, and the refusal prints the
      # real list:
      #
      #   production, beta, alpha, internal,
      #   wear:The Beginning, wear:beta, wear:internal, wear:production
      #
      # wear:internal is the direct analogue of the phone's 'internal':
      # minutes, no review wait, and the one that puts a build on your own
      # watch. 'wear:The Beginning' is this app's own closed-testing
      # track.
      #
      # ONE-TIME CONSOLE STEP, WHICH NO API CALL REPLACES: Play Console ->
      # Test and release -> Advanced settings -> Form factors -> Add form
      # factor -> Wear OS. Without it the wear: tracks do not exist at
      # all, which is why this step is separately gated and does not run
      # by default.
      - name: Publish the watch bundle to Google Play
        id: playwear
        continue-on-error: true
        if: ${{ inputs.publishWear && env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orbitalempire.game
          releaseFiles: android/wear/build/outputs/bundle/release/*.aab
          track: ${{ inputs.wearTrack || 'wear:internal' }}
          status: completed

      # Same expired-edit race as the phone upload, and now likelier:
      # this job opens an edit of its own moments after the phone step
      # closed one.
      - name: Publish the watch bundle to Google Play (retry)
        if: ${{ inputs.publishWear && env.PLAY_JSON != '' && steps.playwear.outcome == 'failure' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orbitalempire.game
          releaseFiles: android/wear/build/outputs/bundle/release/*.aab
          track: ${{ inputs.wearTrack || 'wear:internal' }}
          status: completed
