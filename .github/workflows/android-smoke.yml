# ============================================================
# Launch the Android app in an emulator and report whether it lives.
#
# The one question this answers is the one nothing else can: does the
# APK open on a real Android, and if not, what is the stack trace. The
# build workflow proves the APK compiles; this proves it runs. It exists
# because a launch crash cannot be diagnosed from the manifest, the dex,
# or the server — all three were clean the day 1.2.0 crashed on open.
# ============================================================

name: Android smoke

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API level to boot'
        required: false
        default: '29'
  # A push trigger too, because workflow_dispatch can only be resolved
  # for files that already exist on the default branch, and this one
  # lives on the deploy branch.
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'android/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Unsigned is fine: the emulator does not care, and this keeps the
      # signing key out of a job that only needs to watch logcat.
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot, install, launch, read the crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '29' }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.orbitalempire.game/com.google.androidbrowserhelper.trusted.LauncherActivity || true
            sleep 12
            echo "================ FATAL EXCEPTIONS ================"
            adb logcat -d AndroidRuntime:E *:S | head -120
            echo "================ ORBITAL PROCESS ================="
            adb logcat -d | grep -iE "orbitalempire|OrbitalWidget|androidbrowserhelper|TwaLauncher" | head -80
            echo "================ IS IT ALIVE? ===================="
            adb shell pidof com.orbitalempire.game && echo "process alive" || echo "PROCESS DEAD"
            adb shell dumpsys activity activities | grep -iE "orbitalempire" | head -10
