# ============================================================
# Launch the Android app in an emulator and report whether it lives.
#
# The one question this answers is the one nothing else can: does the
# APK open on a real Android, and if not, what is the stack trace. The
# build workflow proves the APK compiles; this proves it runs. It exists
# because a launch crash cannot be diagnosed from the manifest, the dex,
# or the server — all three were clean the day 1.2.0 crashed on open.
#
# FOUR SCENARIOS, because a clean launch passing proves less than it
# looks. The crash on Lorne's phone happened on a device that had a
# widget placed and a token stored, after an upgrade — and the widget
# receiver was demonstrably fetching (widget_tokens.last_used_ms moved)
# while the UI would not open. So this also exercises the receiver, then
# opens the UI in the state the receiver leaves behind, then opens it
# the way a widget tap does.
# ============================================================

name: Android smoke

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API level to boot'
        required: false
        default: '29'
  # A push trigger too, because workflow_dispatch can only be resolved
  # for files that already exist on the default branch, and this one
  # lives on the deploy branch.
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/scripts/android-smoke.sh'
      - 'android/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 29 matches the phone's OS. 34 is the lowest google_apis image
        # whose bundled Chrome is new enough to actually run a Trusted
        # Web Activity -- the 29 image ships Chrome 74, which falls into
        # its first-run screen instead, so a "clean launch" there never
        # exercises the TWA handshake at all.
        api: [29, 34]
    name: smoke (API ${{ matrix.api }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Debug, not release: debuggable is what lets run-as write the
      # app's SharedPreferences to plant a token. The emulator does not
      # care about signing either way.
      - name: Build debug APK and AAB
        working-directory: android
        run: gradle --no-daemon assembleDebug bundleDebug assembleDebugAndroidTest

      # bundletool turns the AAB into the split APKs Play would serve a
      # given device. Scenario 5 installs those instead of the universal
      # APK, because that is the install every store user actually gets.
      - name: Fetch bundletool
        run: |
          URL=$(curl -sL https://api.github.com/repos/google/bundletool/releases/latest | grep browser_download_url | grep 'bundletool-all' | cut -d '"' -f 4)
          echo "bundletool: $URL"
          curl -sL "$URL" -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A real, unrevoked, read-only widget token for a probe account with
      # no game. It renders the "not in a game yet" card, which is still a
      # genuine PNG through the genuine fetch/decode path. It can render
      # one image and nothing else, so it is fine in a log.
      - name: Prepare the planted token
        run: |
          cat > /tmp/orbital_widget.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
              <string name="token">s8oAXakX9yrqy67LkHmsJO5VaqdZ0HZK</string>
          </map>
          EOF

      # The artifact a store install actually puts on a phone: generated
      # from the AAB by Play and signed with Google's app signing key. Only
      # this is the same app, signature-wise, as what a tester installs.
      # Everything CI builds is signed by us and is a different app to
      # Digital Asset Links. Skipped cleanly when the secret is absent
      # (a fork), so scenario 6 reports "no Play artifact" not a failure.
      - name: Fetch the Google-signed APKs Play serves
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "no PLAY_SERVICE_ACCOUNT_JSON; scenario 6 will be skipped"; exit 0; fi
          printf '%s' "$PLAY_JSON" > /tmp/play-sa.json
          PLAY_SA_JSON=/tmp/play-sa.json node .github/scripts/play-apks.mjs "${PLAY_VERSION_CODE:-6}" /tmp/playapks
          ls -l /tmp/playapks

      - name: Boot, install, and run the scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          # One script file, one line. The action runs each line of this
          # block in its own shell, so anything multi-line loses its
          # variables between lines; see the script's header.
          script: bash .github/scripts/android-smoke.sh
        env:
          ORBITAL_AGENT_KEY: ${{ secrets.ORBITAL_AGENT_KEY }}
