# ============================================================
# Upload the Wear OS store screenshots.
#
# SEPARATE FROM THE BUILD, because it has nothing to do with one: this
# changes the store LISTING, which is what Play actually checks before
# it will serve a watch app, and which no amount of rebuilding affects.
#
# TRIGGERED BY A TAG, and never by a branch push. It commits a Play edit
# and sends a listing change to review, which is not something an
# ordinary push should do behind somebody's back -- and workflow_dispatch
# is not available here, because GitHub only offers it for workflows on
# the DEFAULT branch and main is thousands of commits behind the branch
# this project deploys from (scripts/deploy-guard.mjs).
#
# A tag is the honest shape for both problems: it works from any branch,
# and pushing one is a deliberate act rather than a side effect of
# saving a file.
#
#   git tag wear-shots-1 && git push origin wear-shots-1
#
# Regenerate the images first if the UI has moved:
#   node scripts/gen-wear-screenshots.mjs
# ============================================================

name: Play wear screenshots

on:
  push:
    tags:
      - 'wear-shots-*'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to the store listing
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "No PLAY_SERVICE_ACCOUNT_JSON configured." >&2
            exit 1
          fi
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-sa.json"
          PLAY_SA_JSON="$RUNNER_TEMP/play-sa.json" \
            node .github/scripts/play-upload-wear-shots.mjs play/wear \
            | tee "$RUNNER_TEMP/out.txt"
          {
            echo '### Wear screenshots'
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
